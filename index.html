<body>
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <h1 class="logo">🔣 Base64 Tool</h1>
        <p class="tagline">Base64 编解码 · 图片/文件互转 · 浏览器端处理</p>
      </div>
    </div>
  </header>

  <main class="main container">
    <!-- Tab Navigation -->
    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-tab="text" tabindex="0">
        <span class="tab-icon">📝</span>
        <span class="tab-label">文本编解码</span>
      </button>
      <button class="tab" role="tab" aria-selected="false" data-tab="image" tabindex="-1">
        <span class="tab-icon">🖼️</span>
        <span class="tab-label">图片/文件</span>
      </button>
    </nav>

    <!-- === Tab: Text === -->
    <section class="tab-panel active" id="panel-text" role="tabpanel">
      <div class="panel-body">
        <!-- Direction -->
        <div class="direction-bar">
          <button class="dir-btn active" data-dir="encode">编码 →</button>
          <button class="dir-btn" data-dir="decode">← 解码</button>
        </div>

        <!-- Options -->
        <div class="options-bar">
          <label class="checkbox-label">
            <input type="checkbox" id="opt-urlsafe">
            URL 安全模式（替换 +/ 为 -_）
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-wrap" checked>
            每 76 字符换行
          </label>
        </div>

        <!-- Input -->
        <div class="input-section">
          <div class="editor-panel">
            <div class="editor-header">
              <label for="text-input">输入</label>
              <div class="editor-actions">
                <button class="btn btn-sm" onclick="loadTextSample()">📝 示例</button>
                <button class="btn btn-sm" onclick="clearInput()">清空</button>
                <span id="input-size" class="size-badge">0 B</span>
              </div>
            </div>
            <textarea id="text-input" class="code-editor" placeholder="粘贴文本或 Base64 字符串..." spellcheck="false"></textarea>
          </div>
        </div>

        <!-- Button -->
        <div class="action-bar">
          <button class="btn btn-primary btn-lg" onclick="processText()">⚡ 转换</button>
        </div>

        <!-- Output -->
        <div class="input-section">
          <div class="editor-panel">
            <div class="editor-header">
              <label for="text-output">输出</label>
              <div class="editor-actions">
                <span id="output-size" class="size-badge">0 B</span>
                <button class="btn btn-sm" onclick="copyOutput()">📋 复制</button>
                <button class="btn btn-sm" onclick="downloadOutput()">⬇ 下载</button>
              </div>
            </div>
            <textarea id="text-output" class="code-editor" readonly placeholder="结果将显示在这里..." spellcheck="false"></textarea>
          </div>
        </div>

        <div id="text-status" class="status-bar"></div>
      </div>
    </section>

    <!-- === Tab: Image/File === -->
    <section class="tab-panel" id="panel-image" role="tabpanel" hidden>
      <div class="panel-body">
        <!-- Upload Area -->
        <div class="upload-section">
          <div id="drop-zone" class="drop-zone">
            <div class="drop-content">
              <span class="drop-icon">📁</span>
              <p>拖拽文件到此处或点击选择</p>
              <p class="drop-hint">支持图片、PDF、ZIP 等任何文件</p>
            </div>
            <input type="file" id="file-input" class="file-input" accept="*/*">
          </div>
        </div>

        <!-- File Info -->
        <div id="file-info" class="file-info" style="display:none">
          <div class="file-detail">
            <span id="file-name" class="file-name"></span>
            <span id="file-type" class="file-type-badge"></span>
            <span id="file-size-info" class="file-size-text"></span>
          </div>
          <div class="file-preview" id="file-preview"></div>
        </div>

        <!-- Image to Base64 -->
        <div class="input-section">
          <div class="editor-panel">
            <div class="editor-header">
              <label>Base64 数据</label>
              <div class="editor-actions">
                <span id="b64-size" class="size-badge">0 B</span>
                <button class="btn btn-sm" onclick="copyB64()">📋 复制</button>
              </div>
            </div>
            <textarea id="b64-output" class="code-editor" readonly placeholder="Base64 数据将显示在这里..." spellcheck="false" style="min-height:160px"></textarea>
          </div>
        </div>

        <!-- Data URI -->
        <div class="input-section">
          <div class="editor-panel">
            <div class="editor-header">
              <label>Data URI</label>
              <div class="editor-actions">
                <button class="btn btn-sm" onclick="copyDataUri()">📋 复制</button>
              </div>
            </div>
            <textarea id="data-uri-output" class="code-editor" readonly placeholder="data:image/png;base64,..." spellcheck="false" style="min-height:80px"></textarea>
          </div>
        </div>

        <!-- Base64 to File -->
        <div class="decode-section">
          <div class="section-title">从 Base64 还原文件</div>
          <div class="editor-panel">
            <div class="editor-header">
              <label for="b64-input">粘贴 Base64 数据</label>
              <div class="editor-actions">
                <button class="btn btn-sm" onclick="clearB64Input()">清空</button>
              </div>
            </div>
            <textarea id="b64-input" class="code-editor" placeholder="粘贴 Base64 字符串或 Data URI..." spellcheck="false" style="min-height:100px"></textarea>
          </div>
          <div class="action-bar">
            <label class="checkbox-label">
              <input type="text" id="decode-filename" class="small-input" placeholder="文件名（含扩展名）" value="decoded-file">
              <span class="hint">.png</span>
            </label>
            <button class="btn btn-primary" onclick="decodeB64()">⬇ 下载还原文件</button>
          </div>
        </div>

        <div id="file-status" class="status-bar"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>🔣 Base64 Tool — 所有处理在浏览器端完成，文件不上传服务器</p>
      <p class="footer-small">纯前端工具 · 零服务端 · 隐私安全</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
